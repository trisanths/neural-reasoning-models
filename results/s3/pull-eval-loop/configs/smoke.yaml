# Smoke class, about 8M non embedding params, SPEC.md section 5.
# Context is held at 1024 so a full batch fits comfortably on one L40S.
model:
  vocab_size: 32768
  d_model: 256
  n_layers: 8
  n_heads: 8
  d_ff: 704
  max_seq_len: 1024
  rope_theta: 10000.0
  norm_eps: 1.0e-5
optimizer:
  lr: 1.0e-3
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
schedule:
  warmup_steps: 100
  max_steps: 2000
  min_lr_ratio: 0.1
  warmup_phase_steps: 20
train:
  batch_size: 16
  grad_accum_steps: 1
  grad_clip: 1.0
  seed: 1234
  log_interval: 10
  ckpt_interval: 500
