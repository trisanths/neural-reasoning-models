model:
  d_ff: 3648
  d_model: 1280
  max_seq_len: 4096
  n_heads: 20
  n_layers: 14
  norm_eps: 1.0e-05
  recurrent:
    backprop_last_k: 2
    coda_layers: 2
    core_layers: 11
    grad_checkpoint: true
    inject_prelude: true
    loop_embedding: true
    loops: 2
    prelude_layers: 1
    train_loop_sampling:
    - 1
    - 4
  rope_theta: 10000.0
  vocab_size: 32768
optimizer:
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-08
  lr: 0.0003
  weight_decay: 0.1
schedule:
  max_steps: 26700
  min_lr_ratio: 0.1
  warmup_phase_steps: 55
  warmup_steps: 500
train:
  batch_size: 8
  ckpt_interval: 1070
  compile: true
  grad_accum_steps: 8
  grad_clip: 1.0
  log_interval: 20
  seed: 712
