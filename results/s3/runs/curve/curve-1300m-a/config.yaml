model:
  d_ff: 5504
  d_model: 2048
  max_seq_len: 4096
  n_heads: 32
  n_layers: 24
  norm_eps: 1.0e-05
  rope_theta: 10000.0
  vocab_size: 32768
optimizer:
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-08
  lr: 0.0002
  weight_decay: 0.1
schedule:
  max_steps: 26700
  min_lr_ratio: 0.1
  warmup_phase_steps: 200
  warmup_steps: 1000
train:
  batch_size: 2
  ckpt_interval: 300
  compile: true
  grad_accum_steps: 32
  grad_clip: 1.0
  log_interval: 20
  seed: 111
