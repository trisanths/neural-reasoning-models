model:
  d_ff: 2048
  d_model: 768
  max_seq_len: 4096
  n_heads: 12
  n_layers: 12
  norm_eps: 1.0e-05
  rope_theta: 10000.0
  vocab_size: 32768
optimizer:
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-08
  lr: 0.0006
  weight_decay: 0.1
schedule:
  max_steps: 26700
  min_lr_ratio: 0.1
  warmup_phase_steps: 25
  warmup_steps: 300
train:
  batch_size: 16
  ckpt_interval: 2500
  compile: true
  grad_accum_steps: 4
  grad_clip: 1.0
  log_interval: 20
  seed: 211
