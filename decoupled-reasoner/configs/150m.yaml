# 150M class, SPEC.md section 5. Steps sized for 20 tokens per parameter at
# 262k tokens per optimizer step.
model:
  vocab_size: 32768
  d_model: 768
  n_layers: 12
  n_heads: 12
  d_ff: 2048
  max_seq_len: 4096
  rope_theta: 10000.0
  norm_eps: 1.0e-5
optimizer:
  lr: 6.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
schedule:
  warmup_steps: 300
  max_steps: 11500
  min_lr_ratio: 0.1
  warmup_phase_steps: 25
# Batch convention, enforced by src/train/distributed.py at startup:
#
#   global_batch_size == batch_size * grad_accum_steps * world_size
#
# global_batch_size is sequences per optimizer step summed over every rank and
# is the number to hold fixed. batch_size is the per rank micro batch. The
# accumulation is derived from the world size, so adding GPUs shortens the
# accumulation and leaves the tokens per step alone; it never multiplies the
# batch. grad_accum_steps below is the world size one value and is checked
# against the other two. A world size that does not divide the global batch
# fails before the first step.
train:
  batch_size: 8
  global_batch_size: 64
  grad_accum_steps: 8
  grad_clip: 1.0
  seed: 1234
  log_interval: 20
  ckpt_interval: 1000
