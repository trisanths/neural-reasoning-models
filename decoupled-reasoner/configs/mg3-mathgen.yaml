# Mathgen universes. A retrieved chunk runs to 432 tokens where a skillacq page
# is a few sentences, so the 640 token rollout budget would end a rollout on the
# first served chunk and every score would be a budget artifact. max_len 2048
# and 192 new tokens leave four rounds reachable; the stop_reason breakdown in
# every cell says whether the budget bound anything.
env:
  max_rounds: 4
  max_new_tokens: 192
  query_max_tokens: 24
  max_len: 2048
  correct_reward: 1.0
  format_bonus: 0.05
  retrieval_bonus: 0.05
  degenerate_query_penalty: 0.05
  contains_slack_tokens: 6
tasks:
  questions_per_episode: 1000000
  min_hops: 1
  max_prompt_tokens: 512
