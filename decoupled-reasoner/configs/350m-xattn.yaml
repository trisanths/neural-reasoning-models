# 350M class evidence cross-attention model, the fair-comparison twin of
# configs/350m.yaml. Total parameters 375.59M against that config's 375.44M,
# a 0.04 percent difference, so any gap in results is architecture and not
# capacity. The decoder gives up three of its 24 layers and gains 128 units
# of feed forward width to pay for a 13.9M parameter evidence encoder and
# 16.5M of cross-attention.
#
# Split: embedding and head 67.11M, decoder 278.05M, encoder 13.91M,
# cross-attention 16.53M.
#
# max_seq_len is the working sequence only: question, answer, and any
# scratchpad. Evidence is not in it. A bank of 256 chunks of 128 tokens is
# 32768 evidence tokens, eight times the 4096 token context of the standard
# 350m and reachable at a fraction of its cost. Measured on one L40S, the
# whole training step at bank 256 and batch 8 peaks at 39.0 GB, while the
# plain 350m decoder reading the same 32768 tokens in its context window runs
# out of memory on the same card at batch 1.
model:
  vocab_size: 32768
  d_model: 1024
  n_layers: 21
  n_heads: 16
  d_ff: 2944
  max_seq_len: 2048
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  d_enc: 512
  enc_layers: 4
  enc_heads: 8
  enc_d_ff: 1408
  chunk_len: 128
  xattn_every: 3
  xattn_n_kv_heads: 4
  evidence_mode: pooled
  max_chunks: 1024
  n_reliability_buckets: 16
  gate_bias_init: 0.0
# The evidence bank the collator builds, and the two sources the examples
# come from. src/train/evidence_stream.py reads this section.
#
# bank_mode oracle guarantees the gold chunk is in the bank, which is the
# regime the gate and the selection behaviour are learned in; retrieval fills
# the bank with the BM25 top N instead and lets the model meet the
# retriever's real hit rate. The lane trains under oracle and is evaluated
# under both, so the gap between them is the retriever's contribution rather
# than a confound inside training.
#
# web_share is the fraction of episodes drawn from the pre-rendered
# scrubbed-web file rather than generated by src.worldgen. 0.25 matches the
# 0.20 webret share regime E3 carries, rounded up because this lane has no
# other source of real prose: worldgen text is templated, and a model that
# only ever reads templates learns to select templates.
#
# questions_per_episode 4 sets how many examples one generated episode
# serves. It trades CPU against world diversity: at 4 the stream generates
# one episode per four examples, and the measured build rate is 1646
# examples per second against the roughly 30 per second the GPU consumes, so
# the stream is nowhere near the bottleneck.
#
# pool_episodes 256 rather than 64 because a worldgen episode yields only
# about 20 chunks: at 64 the pool tops out near 1275 and cannot reach
# pool_chunks 4096, which would leave every bank padded from the same small
# set. Note what the pool cannot fix: a worldgen document is one sentence, so
# a 256 chunk bank holds about 6100 real tokens rather than the 32768 the
# tensor has room for. The web share is what puts full length prose in the
# bank.
data:
  bank_size: 256
  chunk_len: 128
  bank_mode: oracle
  pool_chunks: 4096
  pool_episodes: 256
  questions_per_episode: 4
  web_share: 0.25
  max_question_tokens: 256
  max_answer_tokens: 64
  contradiction_rate: 0.15
  filler_rate: 0.25
  # Banks are assembled one optimizer step ahead on a background thread.
  # Building a micro batch of 8 measures 0.051 s, so a step of eight
  # accumulation micro batches is 0.41 s of assembly against a step of
  # roughly 2.3 s. Set to 0 to build inline and confirm the order is the
  # same.
  prefetch: 4
  seed: 1234
optimizer:
  lr: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
schedule:
  warmup_steps: 500
  max_steps: 26700
  min_lr_ratio: 0.1
  warmup_phase_steps: 0
# Batch shape for one H100: 8 sequences per micro batch and 8 gradient
# accumulation steps, so 64 sequences and 16,384 evidence chunks per
# optimizer step. compile is off because the working sequence is padded to
# the longest row of each batch and its width therefore changes from step to
# step, which dynamo would recompile against.
train:
  batch_size: 8
  grad_accum_steps: 8
  grad_clip: 1.0
  seed: 1234
  log_interval: 20
  ckpt_interval: 1000
  compile: false
