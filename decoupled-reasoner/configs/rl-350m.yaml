# GRPO against the verifiers for a 350M policy, sized for one L40S.
# Prompts hold the world preamble and the question only, so every fact the
# answer needs has to arrive through the retriever.
env:
  max_rounds: 4
  max_new_tokens: 96
  query_max_tokens: 24
  max_len: 640
  correct_reward: 1.0
  format_bonus: 0.05
  retrieval_bonus: 0.05
  degenerate_query_penalty: 0.05
  contains_slack_tokens: 6
grpo:
  group_size: 8
  prompts_per_step: 4
  inner_epochs: 1
  micro_batch_size: 8
  clip_eps: 0.2
  kl_coef: 0.02
  ent_coef: 0.0
  normalize_advantage: true
  drop_zero_variance_groups: true
  lr: 1.0e-6
  weight_decay: 0.0
  grad_clip: 1.0
  warmup_steps: 10
  max_steps: 200
  min_lr_ratio: 1.0
  seed: 1234
tasks:
  questions_per_episode: 2
  min_hops: 1
  max_prompt_tokens: 384
  limit_episodes: 1500
run:
  temperature: 1.0
  top_k: 0
  eval_tasks: 96
  eval_batch: 32
  eval_every: 100
  sample_every: 25
  sample_n: 4
  ckpt_every: 100
  log_every: 1
