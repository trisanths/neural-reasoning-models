# 350M class evidence cross-attention model, the fair-comparison twin of
# configs/350m.yaml. Total parameters 375.59M against that config's 375.44M,
# a 0.04 percent difference, so any gap in results is architecture and not
# capacity. The decoder gives up three of its 24 layers and gains 128 units
# of feed forward width to pay for a 13.9M parameter evidence encoder and
# 16.5M of cross-attention.
#
# Split: embedding and head 67.11M, decoder 278.05M, encoder 13.91M,
# cross-attention 16.53M.
#
# max_seq_len is the working sequence only: question, answer, and any
# scratchpad. Evidence is not in it. A bank of 256 chunks of 128 tokens is
# 32768 evidence tokens, eight times the 4096 token context of the standard
# 350m and reachable at a fraction of its cost.
model:
  vocab_size: 32768
  d_model: 1024
  n_layers: 21
  n_heads: 16
  d_ff: 2944
  max_seq_len: 2048
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  d_enc: 512
  enc_layers: 4
  enc_heads: 8
  enc_d_ff: 1408
  chunk_len: 128
  xattn_every: 3
  xattn_n_kv_heads: 4
  evidence_mode: pooled
  max_chunks: 1024
  n_reliability_buckets: 16
  gate_bias_init: 0.0
# The evidence bank the collator builds. oracle guarantees the gold chunk is
# present; retrieval fills the bank with the BM25 top N and lets the model
# meet the retriever's real hit rate.
data:
  bank_size: 256
  chunk_len: 128
  bank_mode: oracle
  pool_chunks: 4096
  seed: 1234
optimizer:
  lr: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
schedule:
  warmup_steps: 500
  max_steps: 26700
  min_lr_ratio: 0.1
  warmup_phase_steps: 55
# Batch shape for one H100. 8 sequences per GPU, 8 GPUs, 8 gradient
# accumulation steps: 512 sequences and 131072 evidence chunks per optimizer
# step. See results/evidence-attention.md for the measured basis.
train:
  batch_size: 8
  grad_accum_steps: 8
  grad_clip: 1.0
  seed: 1234
  log_interval: 20
  ckpt_interval: 1000
