# 700M class, SPEC.md section 5. Steps sized for 20 tokens per parameter at
# 262k tokens per optimizer step.
model:
  vocab_size: 32768
  d_model: 1536
  n_layers: 24
  n_heads: 16
  d_ff: 4096
  max_seq_len: 4096
  rope_theta: 10000.0
  norm_eps: 1.0e-5
optimizer:
  lr: 2.5e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
schedule:
  warmup_steps: 750
  max_steps: 53400
  min_lr_ratio: 0.1
  warmup_phase_steps: 110
train:
  batch_size: 2
  grad_accum_steps: 32
  grad_clip: 1.0
  seed: 1234
  log_interval: 20
  ckpt_interval: 2000
