# The same gate under the wider budget the mathgen pages need. Run so that a
# budget change cannot be confused with a capability change.
env:
  max_rounds: 4
  max_new_tokens: 192
  query_max_tokens: 24
  max_len: 2048
  correct_reward: 1.0
  format_bonus: 0.05
  retrieval_bonus: 0.05
  degenerate_query_penalty: 0.05
  contains_slack_tokens: 6
tasks:
  questions_per_episode: 2
  min_hops: 1
  max_prompt_tokens: 384
